server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:

      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://192.168.*:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: false
          routes:
            - id: eureka-static
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/css/**,/eureka/js/**,/eureka/fonts/**,/eureka/images/**
            - id: eureka-home
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/**
              filters:
                - SetPath=/
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway